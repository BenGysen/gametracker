<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Gametracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF3F9;
  --surface:#FFFFFF;
  --surface-2:#DFE8F3;
  --ink:#0E1B2E;
  --ink-2:#4B5D75;
  --line:#C6D3E2;
  --pitch:#1B3F74;
  --pitch-deep:#112A52;
  --chalk:#F4F8FD;
  --us:#5AAEFF;
  --us-ink:#05203F;
  --them:#7C8CA3;
  --danger:#B5412F;
  --focus:#5AAEFF;
  --radius:14px;
  --shadow:0 1px 0 rgba(21,33,23,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1424;
    --surface:#121F36;
    --surface-2:#1A2C4A;
    --ink:#E9F0F9;
    --ink-2:#A3B3C9;
    --line:#27405F;
    --pitch:#173664;
    --pitch-deep:#0E2246;
    --chalk:#F1F6FC;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1424;--surface:#121F36;--surface-2:#1A2C4A;--ink:#E9F0F9;--ink-2:#A3B3C9;--line:#27405F;--pitch:#173664;--pitch-deep:#0E2246;--chalk:#F1F6FC;--shadow:none;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;
}
button,input,select{font:inherit;color:inherit}
input,select{font-size:16px}
button{cursor:pointer;border:0;background:none;padding:0;margin:0;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;line-height:1.15}
h2{font-size:22px}
h3{font-size:18px}
p{margin:0}
.muted{color:var(--ink-2)}
.hidden{display:none!important}

.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.screen{padding:16px 16px 104px}

/* Scoreboard */
.board{
  color:var(--chalk);
  padding:18px 18px 16px;
  background-color:var(--pitch);
  background-image:
    linear-gradient(to right, rgba(255,255,255,.07) 1px, transparent 1px),
    linear-gradient(180deg, var(--pitch) 0%, var(--pitch-deep) 100%);
  background-size:33.33% 100%, 100% 100%;
  position:relative;
}
.board::after{
  content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.18);
}
.board-inner{position:relative;z-index:1}
.board-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.period-label{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:20px;letter-spacing:.01em}
.status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#5AAEFF;box-shadow:0 0 0 3px rgba(90,174,255,.25);margin-right:7px;vertical-align:1px}
.status-dot.paused{background:#F1F6FC;box-shadow:none}
.status-dot.idle{background:rgba(255,255,255,.35)}
.clock{
  font-family:"Barlow Condensed",sans-serif;font-weight:700;
  font-size:clamp(64px,22vw,96px);line-height:1;letter-spacing:.01em;
  font-variant-numeric:tabular-nums;text-align:center;margin:6px 0 4px;
}
.clock small{font-size:.35em;font-weight:600;color:rgba(255,255,255,.7);margin-left:6px;vertical-align:.5em}
.score-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:6px}
.team{display:flex;flex-direction:column;gap:4px;min-width:0}
.team.right{text-align:right;align-items:flex-end}
.team-name{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.team-tag{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--us);vertical-align:-1px;margin-right:6px}
.team.right .team-tag{margin-right:0;margin-left:6px}
.team-tag.us{background:var(--us)}
.team-tag.them{background:var(--them)}
.venue-label{text-align:center;font-size:13px;color:rgba(255,255,255,.6);margin-top:6px}
.score-num{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.score-dash{font-family:"Barlow Condensed",sans-serif;font-size:40px;color:rgba(255,255,255,.5);font-weight:500}

.clock-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.clock-controls.single{grid-template-columns:1fr}
.btn{
  min-height:52px;border-radius:var(--radius);padding:12px 16px;
  font-weight:600;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .08s ease, filter .12s ease;
}
.btn:active{transform:scale(.98);filter:brightness(.96)}
.btn-chalk{background:var(--chalk);color:var(--pitch-deep)}
.btn-ghost-light{background:rgba(255,255,255,.14);color:var(--chalk)}
.btn-primary{background:var(--pitch);color:var(--chalk)}
.btn-secondary{background:var(--surface-2);color:var(--ink)}
.btn-us{background:var(--us);color:var(--us-ink)}
.btn-them{background:var(--them);color:#fff}
.btn-danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn-text{min-height:44px;color:var(--pitch);font-weight:600;padding:8px 10px}
.btn-block{width:100%}
.btn-big{min-height:72px;font-size:20px;flex-direction:column;gap:2px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:24px}
.btn-big span{font-family:"Barlow",sans-serif;font-weight:500;font-size:13px;opacity:.8}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.actions .full{grid-column:1/-1}

/* Cards / sections */
.section{margin-top:22px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
.card-pad{padding:14px}

/* Forms */
.field{margin-bottom:16px}
.field label{display:block;font-weight:600;margin-bottom:6px}
.input{
  width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);
  padding:10px 14px;
}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--surface);font-weight:600;display:inline-flex;align-items:center;gap:6px;
}
.chip[aria-pressed="true"]{background:var(--pitch);color:var(--chalk);border-color:var(--pitch)}
.chip.small{min-height:40px;padding:6px 14px}
.chip .num{font-family:"Barlow Condensed",sans-serif;font-weight:700;opacity:.75}
.chip-custom{display:inline-flex;align-items:center;gap:6px}
.chip-custom input{width:64px;min-height:44px;border-radius:999px;text-align:center}
.help{font-size:14px;color:var(--ink-2);margin-top:6px}

/* Roster list */
.roster{list-style:none;margin:0;padding:0}
.roster li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.roster li:last-child{border-bottom:0}
.roster .shirt{
  width:38px;height:38px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;flex:none;
}
.roster .name{flex:1;font-weight:500}
.icon-btn{min-width:44px;min-height:44px;display:grid;place-items:center;border-radius:10px;color:var(--ink-2);font-size:20px}
.icon-btn:active{background:var(--surface-2)}

/* Lineup picker */
.lineup-count{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.lineup-count.ok{color:var(--pitch)}
.lineup-count.over{color:var(--danger)}
.player-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.player-toggle{
  min-height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);
  display:flex;align-items:center;gap:10px;padding:8px 12px;text-align:left;
}
.player-toggle .shirt{
  width:34px;height:34px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;flex:none;
}
.player-toggle .pname{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-toggle[aria-pressed="true"]{background:var(--pitch);border-color:var(--pitch);color:var(--chalk)}
.player-toggle[aria-pressed="true"] .shirt{background:rgba(255,255,255,.18)}
.player-toggle.inactive{opacity:.5}

/* On-field strip */
.onfield{display:flex;flex-wrap:wrap;gap:6px}
.pill{
  padding:5px 11px;border-radius:999px;background:var(--surface-2);font-weight:600;font-size:14px;
  display:inline-flex;gap:5px;align-items:center;
}
.pill .num{font-family:"Barlow Condensed",sans-serif;font-weight:700;opacity:.7}
.pill.bench{background:transparent;border:1px dashed var(--line);color:var(--ink-2)}

/* Pitch view */
.pitch{
  background:var(--pitch-deep);border-radius:var(--radius);padding:12px 10px;color:var(--chalk);
  background-image:repeating-linear-gradient(to bottom, rgba(255,255,255,.04) 0 25%, transparent 25% 50%);
  border:2px solid rgba(255,255,255,.35);position:relative;overflow:hidden;
}
.pitch::before{content:"";position:absolute;left:50%;top:50%;width:76px;height:76px;border:2px solid rgba(255,255,255,.22);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.pitch::after{content:"";position:absolute;left:50%;bottom:-2px;width:46%;height:22px;border:2px solid rgba(255,255,255,.22);border-bottom:0;transform:translateX(-50%);pointer-events:none}
.pitch-row{display:flex;justify-content:space-evenly;align-items:center;min-height:62px;gap:6px;position:relative;z-index:1}
.pitch-player{display:flex;flex-direction:column;align-items:center;min-width:64px;max-width:92px}
.pp-num{
  width:34px;height:34px;border-radius:50%;background:var(--us);color:var(--us-ink);display:grid;place-items:center;
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;
}
.pp-pos{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:11px;letter-spacing:.04em;opacity:.75;margin-bottom:2px}
.pp-name{font-size:12px;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pitch-none{position:relative;z-index:1;font-size:13px;color:rgba(255,255,255,.75);text-align:center;margin-top:6px}
.pos-list{list-style:none;margin:0;padding:0}
.pos-list li{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pos-list li:last-child{border-bottom:0}
.pos-list .who{font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.pos-list .who .shirt{width:30px;height:30px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;flex:none}
.pos-list .who span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos-select{min-height:44px;padding:6px 10px;border-radius:10px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.toolbar .btn{min-height:44px;font-size:15px;padding:8px 14px;flex:1}

/* Events */
.events{list-style:none;margin:0;padding:0}
.events li{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.events li:last-child{border-bottom:0}
.ev-time{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;line-height:1.2}
.ev-time small{display:block;font-weight:600;color:var(--ink-2);font-size:12px;letter-spacing:.02em}
.ev-body{min-width:0}
.ev-title{font-weight:600}
.ev-sub{color:var(--ink-2);font-size:14px}
.ev-mark{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:0}
.ev-mark.us{background:var(--us)}
.ev-mark.them{background:var(--them)}
.ev-mark.sub{background:var(--pitch)}
.ev-mark.period{background:transparent;border:2px solid var(--line)}
.ev-mark.note{background:var(--line)}
.ev-score{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--ink-2);font-size:16px;align-self:center}
.empty{padding:28px 14px;text-align:center;color:var(--ink-2)}

/* Stats table */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--ink-2);font-size:14px}
td.n,th.n{text-align:right}
.table-wrap{overflow-x:auto}

/* Export text */
pre.export{
  white-space:pre-wrap;word-break:break-word;margin:0;padding:14px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.5;
  background:var(--surface-2);border-radius:12px;max-height:40vh;overflow:auto;
}

/* Tabs */
.tabs{
  position:fixed;left:0;right:0;bottom:0;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:560px;margin:0 auto;
  z-index:20;
}
.tab{min-height:50px;border-radius:12px;font-weight:600;font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tab .glyph{display:flex;line-height:1}
.tab[aria-selected="true"]{color:var(--pitch);background:var(--surface-2)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tab[aria-selected="true"]{color:var(--chalk)} }

/* Modal / sheet */
.sheet-backdrop{position:fixed;inset:0;background:rgba(10,20,12,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{
  background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;
  animation:rise .22s ease-out;
}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}.btn{transition:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet h2{font-size:22px}
.sheet .field{margin-bottom:18px}
.sheet-actions{display:grid;gap:10px;margin-top:8px}
.sheet-actions.two{grid-template-columns:1fr 1fr}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:60;
  opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1}

.setup-hero{padding:22px 18px 18px;background:linear-gradient(180deg,var(--pitch) 0%,var(--pitch-deep) 100%);color:var(--chalk)}
.setup-hero h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:40px;line-height:1}
.setup-hero p{margin-top:6px;color:rgba(255,255,255,.75)}

.banner{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}

/* Print */
@media print{
  body{background:#fff;color:#000;font-size:12pt}
  .no-print,.tabs,.board,.actions,.toast,.sheet-backdrop{display:none!important}
  .screen{padding:0}
  .card{border:0;box-shadow:none}
  pre.export{background:none;max-height:none;font-size:11pt;padding:0}
  .print-only{display:block!important}
}
.print-only{display:none}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- State ---------- */
const STORE_KEY = 'wedstrijdtracker-v1';

function defaultState(){
  return {
    phase: 'setup',          // 'setup' | 'match'
    tab: 'match',            // 'match' | 'lineup' | 'events' | 'export'
    setup: { team:'', opponent:'', onField:8, periods:4, periodMin:15, formation:'dr8', venue:'home', date: todayISO() },
    players: [],             // {id,name,number}
    onField: [],             // player ids
    positions: {},           // playerId -> position code (current)
    periodLineups: {},       // period -> [{id,pos}] at start
    inMatch: false,
    period: 1,
    periodStatus: 'notStarted', // notStarted | running | paused | ended
    finished: false,
    clock: { accumulated:0, startedAt:null },
    score: { us:0, them:0 },
    events: [],              // {id,type,period,time,data}
    minutes: {}              // playerId -> seconds
  };
}

let S = load();
let tick = null;
let sheet = null;   // current sheet renderer fn or null
let sheetData = {};

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      const st = Object.assign(defaultState(), parsed);
      Object.keys(st.periodLineups||{}).forEach(k=>{ st.periodLineups[k]=(st.periodLineups[k]||[]).map(l=>typeof l==='string'?{id:l,pos:null}:l); });
      (st.events||[]).forEach(ev=>{ if(ev.type==='periodStart' && Array.isArray(ev.data.lineup)) ev.data.lineup=ev.data.lineup.map(l=>typeof l==='string'?{id:l,pos:null}:l); });
      if(st.phase==='match') st.inMatch=true;
      if(!st.setup.formation) st.setup.formation=defaultFormation(st.setup.onField);
      if(!st.setup.venue) st.setup.venue='home';
      const OLD={K:'1',RV:'2',LV:'3',CV:'4',RM:'10',CM:'6',LM:'8',RA:'7',SP:'9',LA:'11'};
      const mig=c=> c && OLD[c] ? OLD[c] : c;
      Object.keys(st.positions||{}).forEach(k=>{ st.positions[k]=mig(st.positions[k]); });
      Object.keys(st.periodLineups||{}).forEach(k=>{ st.periodLineups[k].forEach(l=>{ l.pos=mig(l.pos); }); });
      (st.events||[]).forEach(ev=>{
        if(ev.type==='periodStart') (ev.data.lineup||[]).forEach(l=>{ l.pos=mig(l.pos); });
        if(ev.type==='sub') ev.data.pos=mig(ev.data.pos);
        if(ev.type==='positions') (ev.data.changes||[]).forEach(c=>{ c.pos=mig(c.pos); });
      });
      return st;
    }
  }catch(e){}
  return defaultState();
}

/* ---------- Positions ---------- */
// Standaardnummering (1-11) zoals op een opstellingskaart, van links naar rechts gezien vanuit eigen doel.
const POSITIONS = [
  { code:'1',  abbr:'KP',  name:'Keeper',                row:0, order:0 },
  { code:'3',  abbr:'LVV', name:'Linksachter',           row:1, order:0 },
  { code:'5',  abbr:'CV',  name:'Centrale verdediger',   row:1, order:1 },
  { code:'4',  abbr:'CV',  name:'Centrale verdediger',   row:1, order:2 },
  { code:'2',  abbr:'RVV', name:'Rechtsachter',          row:1, order:3 },
  { code:'8',  abbr:'LM',  name:'Linksmidden',           row:2, order:0 },
  { code:'6',  abbr:'VM',  name:'Verdedigende middenvelder', row:2, order:1 },
  { code:'10', abbr:'RM',  name:'Rechtsmidden',          row:2, order:2 },
  { code:'11', abbr:'LA',  name:'Linksbuiten',           row:3, order:0 },
  { code:'9',  abbr:'SP',  name:'Spits',                 row:3, order:1 },
  { code:'7',  abbr:'RA',  name:'Rechtsbuiten',          row:3, order:2 },
];
const POS_BY_NUMBER = [...POSITIONS].sort((a,b)=>Number(a.code)-Number(b.code));
// Spelsystemen: rijen van achter (doel) naar voor, elke rij van links naar rechts gezien vanuit eigen doel.
const FORMATIONS = {
  dr8:  { name:'Dubbele ruit (1-3-1-3)', players:8,    rows:[['1'],['3','5','2'],['6'],['11','9','7']] },
  f433: { name:'1-4-3-3',                players:11,   rows:[['1'],['3','5','4','2'],['8','6','10'],['11','9','7']] },
  free: { name:'Vrije nummering 1 tot 11', players:null, rows:[['1'],['3','5','4','2'],['8','6','10'],['11','9','7']] },
};
function defaultFormation(n){ n=Number(n); return n===8?'dr8': n===11?'f433':'free'; }
function formation(){ return FORMATIONS[S.setup.formation] || FORMATIONS.free; }
function formationCodes(){ return formation().rows.flat(); }
function formationsFor(n){ n=Number(n); return Object.entries(FORMATIONS).filter(([k,f])=>f.players===null||f.players===n); }
const ROW_NAMES = ['Doel','Verdediging','Middenveld','Aanval'];
function posInfo(code){ return POSITIONS.find(p=>p.code===String(code)); }
function posText(code){ const p=posInfo(code); return p?`${p.code} ${p.abbr}`:''; }
function posLabel(code){ const p=posInfo(code); return p?`${p.code} ${p.abbr} – ${p.name}`:'Geen positie'; }
function currentLineup(){ return S.onField.map(id=>({ id, pos:S.positions[id]||null })); }
function lineupName(l){ return `${shortName(l.id)}${l.pos?` (${posText(l.pos)})`:''}`; }
function posSelect(id, value, extraAttr){
  return `<select class="input pos-select" data-pos="${id}" ${extraAttr||''} aria-label="Positie van ${esc(shortName(id))}">
    <option value="" ${!value?'selected':''}>Geen positie</option>
    ${POS_BY_NUMBER.filter(p=>formationCodes().includes(p.code)||String(value)===p.code).map(p=>`<option value="${p.code}" ${String(value)===p.code?'selected':''}>${p.code} ${p.abbr} – ${p.name}</option>`).join('')}
  </select>`;
}
// Vul posities in op basis van het rugnummer (1-11); geeft een map terug.
function positionsByNumber(base){
  const next=Object.assign({}, base||{});
  S.onField.forEach(id=>{ const p=player(id); const n=p && p.number!=='' && p.number!=null ? String(p.number) : null; if(n && posInfo(n) && formationCodes().includes(n)) next[id]=n; });
  return next;
}
function renderPitch(lineup){
  const frows=formation().rows;
  const rows=frows.map(()=>[]), none=[];
  lineup.forEach(l=>{
    const ri = l.pos ? frows.findIndex(r=>r.includes(String(l.pos))) : -1;
    if(ri>=0) rows[ri].push(l); else none.push(l);
  });
  rows.forEach((r,i)=>r.sort((a,b)=>frows[i].indexOf(String(a.pos))-frows[i].indexOf(String(b.pos))));
  if(!lineup.length) return `<div class="pitch"><p class="muted" style="text-align:center;padding:20px 0;color:rgba(255,255,255,.7)">Nog niemand op het veld</p></div>`;
  return `<div class="pitch" aria-label="Veldopstelling, ${esc(formation().name)}">
    ${rows.map((_,i)=>rows.length-1-i).map(r=>`<div class="pitch-row">${rows[r].map(l=>`<span class="pitch-player"><span class="pp-pos">${esc(posText(l.pos))}</span><span class="pp-num">${esc(player(l.id)?.number??'')}</span><span class="pp-name">${esc(shortName(l.id))}</span></span>`).join('')}</div>`).join('')}
    ${none.length?`<div class="pitch-none">Zonder positie: ${none.map(l=>esc(shortName(l.id))+(l.pos?` (${esc(posText(l.pos))})`:'')).join(', ')}</div>`:''}
  </div>`;
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){}
}
function uid(){ return Math.random().toString(36).slice(2,9); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }

/* ---------- Helpers ---------- */
function player(id){ return S.players.find(p=>p.id===id); }
function pname(id){ const p=player(id); return p ? (p.number!=null && p.number!=='' ? `${p.name} (${p.number})` : p.name) : '—'; }
function shortName(id){ const p=player(id); return p?p.name:'—'; }
function fmt(sec){ sec=Math.max(0,Math.floor(sec)); const m=Math.floor(sec/60), s=sec%60; return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
function elapsed(){ return S.clock.accumulated + (S.clock.startedAt ? (Date.now()-S.clock.startedAt)/1000 : 0); }
function periodName(n, short){
  const total = S.setup.periods;
  if(total===2) return short ? `H${n}` : `${n}e helft`;
  if(total===4) return short ? `K${n}` : `${n}e kwart`;
  if(total===3) return short ? `D${n}` : `${n}e derde`;
  return short ? `P${n}` : `Periode ${n}`;
}
function matchMinute(period, time){ return Math.min((period-1)*S.setup.periodMin + Math.floor(time/60) + 1, 999); }
function isAway(){ return S.setup.venue==='away'; }
function scoreStr(sc){ sc=sc||S.score; return isAway() ? `${sc.them}–${sc.us}` : `${sc.us}–${sc.them}`; }
function matchTitle(){ return isAway() ? `${S.setup.opponent} – ${S.setup.team}` : `${S.setup.team} – ${S.setup.opponent}`; }
function bench(){ return S.players.filter(p=>!S.onField.includes(p.id)).map(p=>p.id); }
function ordinal(n){ return n+'e'; }

function removePlayer(id){
  S.players = S.players.filter(p=>p.id!==id);
  S.onField = S.onField.filter(x=>x!==id);
  delete S.positions[id];
  save();
}
function addEvent(type, data, at){
  const time = (at!=null) ? at : Math.floor(elapsed());
  S.events.push({ id:uid(), type, period:S.period, time, data: data||{} });
  S.events.sort((a,b)=> a.period-b.period || a.time-b.time);
}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1800);
}

/* ---------- Clock ---------- */
let lastTick = null;
function startClock(){
  if(S.periodStatus==='notStarted'){
    S.periodLineups[S.period] = currentLineup();
    addEvent('periodStart', { lineup: currentLineup() });
  }
  S.clock.startedAt = Date.now();
  S.periodStatus = 'running';
  lastTick = Date.now();
  ensureTick();
  save(); render();
}
function pauseClock(){
  creditMinutes();
  S.clock.accumulated = elapsed();
  S.clock.startedAt = null;
  S.periodStatus = 'paused';
  save(); render();
}
function creditMinutes(){
  if(!S.clock.startedAt) return;
  const now = Date.now();
  const delta = (now - (lastTick||now))/1000;
  lastTick = now;
  S.onField.forEach(id=>{ S.minutes[id] = (S.minutes[id]||0) + delta; });
}
function ensureTick(){
  if(tick) return;
  tick = setInterval(()=>{
    if(S.periodStatus==='running'){
      creditMinutes();
      const el = document.getElementById('clock-val');
      if(el) el.textContent = fmt(elapsed());
      const over = elapsed() >= S.setup.periodMin*60;
      const warn = document.getElementById('clock-over');
      if(warn) warn.classList.toggle('hidden', !over);
      if(Math.floor(elapsed())%10===0) save();
    }
  }, 500);
}
function endPeriod(){
  if(S.periodStatus==='running') pauseClock();
  addEvent('periodEnd', { score:{...S.score} });
  S.periodStatus = 'ended';
  if(S.period >= S.setup.periods){ S.finished = true; }
  save(); render();
}
function nextPeriod(){
  S.period += 1;
  S.periodStatus = 'notStarted';
  S.clock = { accumulated:0, startedAt:null };
  save(); render();
}

const app = document.getElementById('app');

  if(S.phase==='setup') renderSetup(); else renderMatch();

function h(strings, ...vals){ return strings.map((s,i)=> s + (vals[i]!==undefined ? vals[i] : '')).join(''); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* --- Setup screen --- */

  return formationsFor(S.setup.onField).map(([k,f])=>`<button class="chip" data-f="${k}" aria-pressed="${S.setup.formation===k}">${esc(f.name)}</button>`).join('');
}

        <span class="chip-custom"><input class="input" id="field-custom" type="number" inputmode="numeric" min="3" max="11" placeholder="…" value="${presetF?'':esc(st.onField)}" aria-label="Ander aantal"></span>

      <label>Aantal speelperiodes</label>
      <div class="chips" id="chips-periods">

        <button class="chip" data-v="4" aria-pressed="${Number(st.periods)===4}">4 kwarten</button>
        <span class="chip-custom"><input class="input" id="periods-custom" type="number" inputmode="numeric" min="1" max="8" placeholder="…" value="${presetP?'':esc(st.periods)}" aria-label="Ander aantal periodes"></span>

    S.phase='match'; S.inMatch=true;

/* --- Match screen --- */
function renderMatch(){
  const st=S.setup;
  const running = S.periodStatus==='running';
  const dotClass = running ? '' : (S.periodStatus==='paused' ? 'paused' : 'idle');
  const periodText = S.finished ? 'Afgelopen' : periodName(S.period);
  const statusText = S.finished ? '' : (running ? 'Loopt' : S.periodStatus==='paused' ? 'Gepauzeerd' : S.periodStatus==='ended' ? 'Rust' : 'Nog niet gestart');

  let controls='';
  if(S.finished){
    controls = `<div class="clock-controls single"><button class="btn btn-chalk" data-act="tab-export">Bekijk het verslag</button></div>`;
  } else if(S.periodStatus==='notStarted'){
    const ok = S.onField.length===Number(st.onField);
    controls = `<div class="clock-controls single"><button class="btn btn-chalk" data-act="start" ${ok?'':'disabled'}>Start ${periodName(S.period).toLowerCase()}</button></div>`;
  } else if(S.periodStatus==='running'){
    controls = `<div class="clock-controls"><button class="btn btn-chalk" data-act="pause">Pauze</button><button class="btn btn-ghost-light" data-act="end">Einde ${periodName(S.period).toLowerCase()}</button></div>`;
  } else if(S.periodStatus==='paused'){
    controls = `<div class="clock-controls"><button class="btn btn-chalk" data-act="start">Hervat</button><button class="btn btn-ghost-light" data-act="end">Einde ${periodName(S.period).toLowerCase()}</button></div>`;
  } else if(S.periodStatus==='ended'){
    controls = `<div class="clock-controls single"><button class="btn btn-chalk" data-act="next">Naar ${periodName(S.period+1).toLowerCase()}</button></div>`;
  }

  const over = !S.finished && elapsed() >= st.periodMin*60;

  const board = h`
  <section class="board no-print" aria-label="Scorebord">
    <div class="board-inner">
      <div class="board-top">
        <span class="period-label"><span class="status-dot ${dotClass}"></span>${esc(periodText)}</span>
        <span class="period-label" style="opacity:.75">${esc(statusText)}</span>
      </div>
      <div class="clock"><span id="clock-val">${fmt(elapsed())}</span><small>/ ${st.periodMin}:00</small></div>
      <p id="clock-over" class="${over?'':'hidden'}" style="text-align:center;color:#9FD0FF;font-weight:600;font-size:14px;margin-top:-2px">Speeltijd voorbij</p>
      <div class="score-row">
        ${isAway() ? `
        <div class="team"><span class="team-name"><span class="team-tag them"></span>${esc(st.opponent)}</span><span class="score-num">${S.score.them}</span></div>
        <span class="score-dash">–</span>
        <div class="team right"><span class="team-name">${esc(st.team)}<span class="team-tag us"></span></span><span class="score-num">${S.score.us}</span></div>
        ` : `
        <div class="team"><span class="team-name"><span class="team-tag us"></span>${esc(st.team)}</span><span class="score-num">${S.score.us}</span></div>
        <span class="score-dash">–</span>
        <div class="team right"><span class="team-name">${esc(st.opponent)}<span class="team-tag them"></span></span><span class="score-num">${S.score.them}</span></div>
        `}
      </div>
      <p class="venue-label">${isAway()?'Uitwedstrijd':'Thuiswedstrijd'}</p>
      ${controls}
    </div>
  </section>`;

  let body='';
  if(S.tab==='match') body = renderTabMatch();
  else if(S.tab==='lineup') body = renderTabLineup();
  else if(S.tab==='events') body = renderTabEvents();
  else body = renderTabExport();

  app.innerHTML = board + `<main class="screen">${body}</main>` + h`
  <nav class="tabs no-print" role="tablist" aria-label="Onderdelen">
    ${[['match',ICONS.clock,'Wedstrijd'],['lineup',ICONS.shirt,'Opstelling'],['events',ICONS.list,'Verloop'],['export',ICONS.share,'Verslag']].map(([k,g,l])=>
      `<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab===k}"><span class="glyph" aria-hidden="true">${g}</span>${l}</button>`).join('')}
  </nav>`;

  app.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{ S.tab=b.dataset.tab; save(); render(); window.scrollTo(0,0); }));
  app.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>onAction(b.dataset.act, b)));
  bindTab();
  if(running) ensureTick();
}

function renderTabMatch(){
  const canLog = S.periodStatus==='running' || S.periodStatus==='paused';
  const needLineup = S.periodStatus==='notStarted' && !S.finished;
  let lineupBlock='';
  if(needLineup){

    </div>` : ''}

function renderTabEvents(){

function describeEvent(ev){
  const d=ev.data||{};
  switch(ev.type){
    case 'goal': {
      let t = d.ownGoal ? `Eigen doelpunt tegenstander` : `Doelpunt ${d.scorer?shortName(d.scorer):'onbekend'}`;
      let s = d.assist ? `Assist ${shortName(d.assist)}` : (d.ownGoal?'':'Zonder assist');
      return { mark:'us', title:t, sub:s, score:scoreStr(d.score) };
    }
    case 'goalThem': return { mark:'them', title:`Doelpunt ${S.setup.opponent}`, sub: d.ownGoal?`Eigen doelpunt ${shortName(d.ownGoal)}`:'', score:scoreStr(d.score) };
    case 'sub': return { mark:'sub', title:`Wissel`, sub:`${shortName(d.in)} erin${d.pos?` als ${posText(d.pos)}`:''}, ${shortName(d.out)} eruit`, score:'' };
    case 'positions': return { mark:'sub', title:`Positiewissel`, sub:(d.changes||[]).map(c=>`${shortName(c.id)} naar ${c.pos?posText(c.pos):'geen positie'}`).join(', '), score:'' };
    case 'periodStart': return { mark:'period', title:`Start ${periodName(ev.period).toLowerCase()}`, sub:(d.lineup||[]).map(l=>typeof l==='string'?shortName(l):lineupName(l)).join(', '), score:'' };
    case 'periodEnd': return { mark:'period', title:`Einde ${periodName(ev.period).toLowerCase()}`, sub:'', score: d.score?scoreStr(d.score):'' };
    case 'note': return { mark:'note', title:d.text||'Notitie', sub:'', score:'' };
  }
  return { mark:'note', title:ev.type, sub:'', score:'' };
}

function renderEventList(list, deletable){
  if(!list.length) return `<div class="empty">Nog geen gebeurtenissen. Start de klok en noteer doelpunten en wissels.</div>`;
  return `<ul class="events" style="padding:0 14px">${list.map(ev=>{
    const d=describeEvent(ev);
    return `<li>
      <div class="ev-time">${fmt(ev.time)}<small>${esc(periodName(ev.period,true))} · ${matchMinute(ev.period,ev.time)}'</small></div>
      <div class="ev-body"><div class="ev-title"><span class="ev-mark ${d.mark}"></span>${esc(d.title)}</div>${d.sub?`<div class="ev-sub">${esc(d.sub)}</div>`:''}</div>
      ${deletable ? `<button class="icon-btn" data-del-ev="${ev.id}" aria-label="Verwijder gebeurtenis">✕</button>` : `<span class="ev-score">${esc(d.score)}</span>`}
    </li>`;}).join('')}</ul>`;
}

function stats(){
  const map={};
  S.players.forEach(p=>map[p.id]={ id:p.id, name:p.name, number:p.number, goals:0, assists:0, min:Math.round((S.minutes[p.id]||0)/60) });
  S.events.forEach(ev=>{
    if(ev.type==='goal' && !ev.data.ownGoal){
      if(ev.data.scorer && map[ev.data.scorer]) map[ev.data.scorer].goals++;
      if(ev.data.assist && map[ev.data.assist]) map[ev.data.assist].assists++;
    }
  });
  return Object.values(map).sort((a,b)=> (b.goals-a.goals) || (b.assists-a.assists) || (b.min-a.min) || a.name.localeCompare(b.name));
}
function renderStatsTable(){
  return `<table><thead><tr><th>Speler</th><th class="n">Goals</th><th class="n">Assists</th><th class="n">Min</th></tr></thead><tbody>
    ${stats().map(s=>`<tr><td>${esc(s.name)}</td><td class="n">${s.goals}</td><td class="n">${s.assists}</td><td class="n">${s.min}</td></tr>`).join('')}
  </tbody></table>`;
}

function buildReport(){
  const st=S.setup;
  const lines=[];
  lines.push(isAway() ? `${st.opponent} ${S.score.them} – ${S.score.us} ${st.team}` : `${st.team} ${S.score.us} – ${S.score.them} ${st.opponent}`);
  const d = st.date ? new Date(st.date+'T12:00:00') : null;
  const dateStr = d && !isNaN(d) ? d.toLocaleDateString('nl-BE',{weekday:'long',day:'numeric',month:'long',year:'numeric'}) : st.date;
  lines.push(`${dateStr}, ${isAway()?'uitwedstrijd':'thuiswedstrijd'}, ${st.periods} × ${st.periodMin} min, ${st.onField} tegen ${st.onField}${st.formation!=='free'?`, ${formation().name.toLowerCase()}`:''}`);
  if(!S.finished) lines.push(`(wedstrijd nog bezig: ${periodName(S.period).toLowerCase()}, ${fmt(elapsed())})`);
  lines.push('');
  lines.push('Verloop');
  if(!S.events.length) lines.push('—');
  S.events.forEach(ev=>{
    const dsc=describeEvent(ev);
    const icon = ev.type==='goal' ? '⚽' : ev.type==='goalThem' ? '⚽' : ev.type==='sub' ? '🔁' : ev.type==='positions' ? '↔️' : ev.type==='note' ? '📝' : '⏱';
    let txt = dsc.title;
    if(ev.type==='goal' && dsc.sub && !ev.data.ownGoal) txt += ` (${dsc.sub.toLowerCase()})`;
    else if(ev.type==='goalThem' && dsc.sub) txt += ` (${dsc.sub.toLowerCase()})`;
    else if(ev.type==='sub' || ev.type==='positions') txt += `: ${dsc.sub}`;
    else if(ev.type==='periodStart') txt += `: ${dsc.sub}`;
    const score = dsc.score ? `  ${dsc.score}` : '';
    lines.push(`${periodName(ev.period,true)} ${fmt(ev.time)} ${icon} ${txt}${score}`);
  });
  const keys=Object.keys(S.periodLineups).map(Number).sort((a,b)=>a-b);
  if(keys.length){
    lines.push('');
    lines.push('Basisopstelling');
    keys.forEach(k=>{
      const lu=S.periodLineups[k]||[];
      const byRow=[3,2,1,0].map(r=>lu.filter(l=>posInfo(l.pos)?.row===r).map(l=>`${posText(l.pos)} ${shortName(l.id)}`).join(', ')).filter(Boolean);
      const none=lu.filter(l=>!posInfo(l.pos)).map(l=>shortName(l.id));
      if(none.length) byRow.push(none.join(', '));
      lines.push(`${periodName(k)}: ${byRow.join(' | ')}`);
    });
  }
  lines.push('');
  lines.push('Statistieken');
  stats().forEach(s=>{
    const parts=[];
    if(s.goals) parts.push(`${s.goals} ${s.goals===1?'goal':'goals'}`);
    if(s.assists) parts.push(`${s.assists} ${s.assists===1?'assist':'assists'}`);
    parts.push(`${s.min} min`);
    lines.push(`${s.name}: ${parts.join(', ')}`);
  });
  return lines.join('\n');
}

function bindTab(){
  app.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.pick;
    if(S.onField.includes(id)) S.onField=S.onField.filter(x=>x!==id); else S.onField.push(id);
    save(); render();
  }));
  app.querySelectorAll('select[data-pos]').forEach(sel=>sel.addEventListener('change',()=>{
    const id=sel.dataset.pos;
    if(sel.value) S.positions[id]=sel.value; else delete S.positions[id];
    save(); render();
  }));
  app.querySelectorAll('[data-del-ev]').forEach(b=>b.addEventListener('click',()=>{
    const ev=S.events.find(e=>e.id===b.dataset.delEv); if(!ev) return;
    askConfirm('Gebeurtenis verwijderen?', describeEvent(ev).title, 'Verwijder', ()=>deleteEvent(ev), true);
  }));
}
function deleteEvent(ev){
  {
    if(ev.type==='goal'){ S.score.us=Math.max(0,S.score.us-1); }
    if(ev.type==='goalThem'){ S.score.them=Math.max(0,S.score.them-1); }
    if(ev.type==='sub'){
      const {in:pin, out:pout}=ev.data;
      if(S.onField.includes(pin) && !S.onField.includes(pout)){
        S.onField=S.onField.map(x=>x===pin?pout:x);
        const p=S.positions[pin]; delete S.positions[pin]; if(p) S.positions[pout]=p;
      }
    }
    S.events=S.events.filter(e=>e.id!==ev.id);
    // recompute stored scores on later events
    let us=0, them=0;
    S.events.forEach(e=>{ if(e.type==='goal'){us++; e.data.score={us,them};} if(e.type==='goalThem'){them++; e.data.score={us,them};} if(e.type==='periodEnd'){ e.data.score={us,them}; } });
    save(); render(); toast('Verwijderd');
  }
}

/* ---------- Actions ---------- */
function onAction(act){
  switch(act){
    case 'start': startClock(); break;
    case 'pause': pauseClock(); break;
    case 'end':
      askConfirm(`${periodName(S.period)} beëindigen?`, S.period>=S.setup.periods?'Daarmee is de wedstrijd afgelopen.':`Daarna kies je de opstelling voor ${periodName(S.period+1).toLowerCase()}.`, `Einde ${periodName(S.period).toLowerCase()}`, endPeriod);
      break;
    case 'next': nextPeriod(); break;
    case 'tab-export': S.tab='export'; save(); render(); break;
    case 'goal-us': openSheet('goalUs'); break;
    case 'goal-them': openSheet('goalThem'); break;
    case 'sub': openSheet('sub'); break;
    case 'players': openSheet('players'); break;
    case 'positions': sheet='positions'; sheetData={ at: stamp(), pos:Object.assign({},S.positions) }; renderSheet(); break;
    case 'auto-pos': S.positions=positionsByNumber(S.positions); save(); render(); toast('Posities volgens rugnummer'); break;
    case 'to-setup': S.phase='setup'; save(); render(); window.scrollTo(0,0); break;
    case 'note': openSheet('note'); break;
    case 'copy': copyReport(); break;
    case 'print': window.print(); break;
    case 'share': shareReport(); break;
    case 'reset':
      askConfirm('Nieuwe wedstrijd starten?', 'Score, klok en verloop worden gewist. De spelerslijst en instellingen blijven.', 'Wis en start opnieuw', ()=>{
        const players=S.players, setup=S.setup;
        S=defaultState(); S.players=players; S.setup=Object.assign(S.setup,{team:setup.team,opponent:'',onField:setup.onField,periods:setup.periods,periodMin:setup.periodMin,formation:setup.formation,date:todayISO()});
        save(); render(); window.scrollTo(0,0);
      }, true);
      break;
  }
}

async function copyReport(){
  const txt=buildReport();
  try{ await navigator.clipboard.writeText(txt); toast('Gekopieerd'); return; }catch(e){}
  try{
    const ta=document.createElement('textarea'); ta.value=txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,txt.length); document.execCommand('copy'); document.body.removeChild(ta); toast('Gekopieerd');
  }catch(e){ toast('Kopiëren lukt niet, selecteer de tekst handmatig'); }
}
async function shareReport(){
  const txt=buildReport();
  if(navigator.share){ try{ await navigator.share({ title:matchTitle(), text:txt }); return; }catch(e){ if(e && e.name==='AbortError') return; } }
  copyReport();
}

/* ---------- Sheets (modals) ---------- */
function stamp(){ return Math.floor(elapsed()); }
function openSheet(kind){ sheet=kind; sheetData={ at: stamp() }; renderSheet(); }
let confirmCb=null;
function askConfirm(title, text, yesLabel, onYes, danger){
  sheet='confirm'; sheetData={ title, text, yesLabel, danger:!!danger }; confirmCb=onYes; renderSheet();
}
function closeSheet(){ sheet=null; sheetData={}; renderSheet(); }

function renderSheet(){
  let el=document.getElementById('sheet-root');
  if(!sheet){ if(el) el.remove(); return; }
  if(!el){ el=document.createElement('div'); el.id='sheet-root'; document.body.appendChild(el); }
  const t = fmt(sheetData.at!=null ? sheetData.at : elapsed());
  const chips=(ids, key, allowNone, noneLabel)=>`
    <div class="chips">
      ${allowNone?`<button class="chip" data-set="${key}" data-val="" aria-pressed="${!sheetData[key]}">${noneLabel||'Geen'}</button>`:''}
      ${ids.map(id=>`<button class="chip" data-set="${key}" data-val="${id}" aria-pressed="${sheetData[key]===id}"><span class="num">${esc(player(id)?.number??'')}</span>${esc(shortName(id))}</button>`).join('')}
    </div>`;
  let inner='';
  if(sheet==='goalUs'){
    const scorerOk = !!sheetData.scorer || sheetData.scorer==='og';
    inner = h`
      <div class="sheet-head"><h2>Doelpunt ${esc(S.setup.team)}</h2><span class="muted">${esc(periodName(S.period,true))} ${t}</span></div>
      <div class="field"><label>Wie scoorde?</label>
        <div class="chips">
          ${S.onField.map(id=>`<button class="chip" data-set="scorer" data-val="${id}" aria-pressed="${sheetData.scorer===id}"><span class="num">${esc(player(id)?.number??'')}</span>${esc(shortName(id))}</button>`).join('')}
          <button class="chip" data-set="scorer" data-val="og" aria-pressed="${sheetData.scorer==='og'}">Eigen doelpunt tegenstander</button>
        </div>
      </div>
      ${sheetData.scorer && sheetData.scorer!=='og' ? `<div class="field"><label>Assist</label>${chips(S.onField.filter(id=>id!==sheetData.scorer),'assist',true,'Geen assist')}</div>`:''}
      <div class="sheet-actions two">
        <button class="btn btn-secondary" data-close>Annuleer</button>
        <button class="btn btn-us" data-confirm ${scorerOk?'':'disabled'}>Bevestig ${scoreStr({us:S.score.us+1,them:S.score.them})}</button>
      </div>`;
  } else if(sheet==='goalThem'){
    inner = h`
      <div class="sheet-head"><h2>Doelpunt ${esc(S.setup.opponent)}</h2><span class="muted">${esc(periodName(S.period,true))} ${t}</span></div>
      <div class="field"><label>Eigen doelpunt van onze speler?</label>${chips(S.onField,'ownGoal',true,'Nee, gewoon tegendoelpunt')}</div>
      <div class="sheet-actions two">
        <button class="btn btn-secondary" data-close>Annuleer</button>
        <button class="btn btn-them" data-confirm>Bevestig ${scoreStr({us:S.score.us,them:S.score.them+1})}</button>
      </div>`;
  } else if(sheet==='sub'){
    const ok = sheetData.out && sheetData.in;
    const defaultPos = sheetData.out ? (S.positions[sheetData.out]||null) : null;
    const chosenPos = sheetData.pos!==undefined ? sheetData.pos : defaultPos;
    inner = h`
      <div class="sheet-head"><h2>Wissel</h2><span class="muted">${esc(periodName(S.period,true))} ${t}</span></div>
      <div class="field"><label>Eruit</label>${chips(S.onField,'out',false)}</div>
      <div class="field"><label>Erin</label>${bench().length?chips(bench(),'in',false):'<p class="muted">Geen wisselspelers op de bank. Voeg er een toe via Spelers beheren.</p>'}</div>
      ${ok ? `<div class="field"><label>Positie van ${esc(shortName(sheetData.in))}</label>${posSelect(sheetData.in, chosenPos, 'data-subpos')}<p class="help">Standaard de positie van ${esc(shortName(sheetData.out))}.</p></div>`:''}
      <div class="sheet-actions two">
        <button class="btn btn-secondary" data-close>Annuleer</button>
        <button class="btn btn-primary" data-confirm ${ok?'':'disabled'}>Bevestig wissel</button>
      </div>
      <div class="sheet-actions" style="margin-top:10px"><button class="btn btn-text" data-confirm-more ${ok?'':'disabled'}>Bevestig en nog een wissel</button></div>`;
  } else if(sheet==='players'){
    inner = h`
      <div class="sheet-head"><h2>Spelers beheren</h2><span class="muted">${S.players.length} spelers</span></div>
      <div class="row" style="margin-bottom:12px">
        <input class="input" id="sh-number" type="number" inputmode="numeric" placeholder="Nr" style="flex:0 0 76px" aria-label="Rugnummer" value="${esc(sheetData.newNumber||'')}">
        <input class="input" id="sh-name" placeholder="Naam speler" autocomplete="off" aria-label="Naam speler" value="${esc(sheetData.newName||'')}">
        <button class="btn btn-primary" data-add-player style="flex:0 0 auto;min-width:92px">Voeg toe</button>
      </div>
      <ul class="roster">
        ${S.players.map(p=>`
          <li>
            <input class="input" type="number" inputmode="numeric" value="${esc(p.number??'')}" data-edit-num="${p.id}" style="flex:0 0 64px;min-height:44px;padding:6px 8px;text-align:center" aria-label="Rugnummer ${esc(p.name)}">
            <input class="input" value="${esc(p.name)}" data-edit-name="${p.id}" style="min-height:44px;padding:6px 10px" aria-label="Naam">
            <span class="muted" style="font-size:12px;flex:0 0 auto">${S.onField.includes(p.id)?'veld':'bank'}</span>
            <button class="icon-btn" data-remove-player="${p.id}" aria-label="Verwijder ${esc(p.name)}">✕</button>
          </li>`).join('')}
      </ul>
      <p class="help" style="margin-top:8px">Nieuwe spelers komen op de bank. Zet ze op het veld via een wissel of bij de basisopstelling van de volgende periode.</p>
      <div class="sheet-actions" style="margin-top:14px"><button class="btn btn-primary" data-close>Klaar</button></div>`;
  } else if(sheet==='positions'){
    const pos = sheetData.pos || {};
    inner = h`
      <div class="sheet-head"><h2>Posities aanpassen</h2><button class="btn-text" data-sheet-autopos>Volgens rugnummer</button></div>
      ${renderPitch(S.onField.map(id=>({id,pos:pos[id]||null})))}
      <div class="card card-pad" style="margin-top:10px"><ul class="pos-list">
        ${S.onField.map(id=>`<li><span class="who"><span class="shirt">${esc(player(id)?.number??'')||'·'}</span><span>${esc(shortName(id))}</span></span>${posSelect(id, pos[id]||null, 'data-sheetpos')}</li>`).join('')}
      </ul></div>
      <div class="sheet-actions two" style="margin-top:14px">
        <button class="btn btn-secondary" data-close>Annuleer</button>
        <button class="btn btn-primary" data-confirm>Bewaar posities</button>
      </div>`;
  } else if(sheet==='confirm'){
    inner = h`
      <div class="sheet-head"><h2>${esc(sheetData.title)}</h2></div>
      ${sheetData.text?`<p style="margin-bottom:16px">${esc(sheetData.text)}</p>`:''}
      <div class="sheet-actions two">
        <button class="btn btn-secondary" data-close>Annuleer</button>
        <button class="btn ${sheetData.danger?'btn-danger':'btn-primary'}" data-confirm>${esc(sheetData.yesLabel||'Ja')}</button>
      </div>`;
  } else if(sheet==='note'){
    inner = h`
      <div class="sheet-head"><h2>Gebeurtenis</h2><span class="muted">${esc(periodName(S.period,true))} ${t}</span></div>
      <div class="field"><label>Snelle keuze</label>
        <div class="chips">${['Gele kaart','Rode kaart','Blessure','Penalty gemist','Penalty tegen gemist','Mooie kans'].map(x=>`<button class="chip small" data-set="text" data-val="${esc(x)}" aria-pressed="${sheetData.text===x}">${esc(x)}</button>`).join('')}</div>
      </div>
      <div class="field"><label for="note-text">Of typ zelf</label><input class="input" id="note-text" value="${esc(sheetData.text||'')}" placeholder="bv. Gele kaart Lars"></div>
      <div class="sheet-actions two">
        <button class="btn btn-secondary" data-close>Annuleer</button>
        <button class="btn btn-primary" data-confirm>Noteer</button>
      </div>`;
  }
  el.innerHTML = `<div class="sheet-backdrop" data-backdrop><div class="sheet" role="dialog" aria-modal="true">${inner}</div></div>`;

  el.querySelector('[data-backdrop]').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeSheet(); });
  el.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeSheet));
  el.querySelectorAll('[data-set]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.set, v=b.dataset.val;
    sheetData[k] = v==='' ? null : v;
    if(k==='scorer' && sheetData.assist===v) sheetData.assist=null;
    if(k==='scorer' && v==='og') sheetData.assist=null;
    renderSheet();
  }));
  const noteInput=el.querySelector('#note-text');
  if(noteInput) noteInput.addEventListener('input', e=>{ sheetData.text=e.target.value; });

  const autoPos=el.querySelector('[data-sheet-autopos]');
  if(autoPos) autoPos.addEventListener('click',()=>{ sheetData.pos=positionsByNumber(sheetData.pos); renderSheet(); });
  const subPos=el.querySelector('select[data-subpos]');
  if(subPos) subPos.addEventListener('change',()=>{ sheetData.pos = subPos.value||null; });
  el.querySelectorAll('select[data-sheetpos]').forEach(sel=>sel.addEventListener('change',()=>{
    sheetData.pos = sheetData.pos||{};
    if(sel.value) sheetData.pos[sel.dataset.pos]=sel.value; else delete sheetData.pos[sel.dataset.pos];
    renderSheet();
  }));

  // players sheet
  const addBtn=el.querySelector('[data-add-player]');
  if(addBtn){
    const nameEl=el.querySelector('#sh-name'), numEl=el.querySelector('#sh-number');
    nameEl.addEventListener('input',()=>{ sheetData.newName=nameEl.value; });
    numEl.addEventListener('input',()=>{ sheetData.newNumber=numEl.value; });
    const add=()=>{
      const name=nameEl.value.trim(); if(!name){ nameEl.focus(); return; }
      const number = numEl.value.trim()==='' ? '' : Number(numEl.value);
      S.players.push({ id:uid(), name, number });
      sheetData.newName=''; sheetData.newNumber='';
      save(); renderSheet(); render();
      const n=document.querySelector('#sh-number'); if(n) n.focus();
      toast(`${name} toegevoegd`);
    };
    addBtn.addEventListener('click', add);
    nameEl.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); } });
    el.querySelectorAll('[data-edit-name]').forEach(inp=>inp.addEventListener('change',()=>{
      const p=player(inp.dataset.editName); if(p && inp.value.trim()){ p.name=inp.value.trim(); save(); render(); }
    }));
    el.querySelectorAll('[data-edit-num]').forEach(inp=>inp.addEventListener('change',()=>{
      const p=player(inp.dataset.editNum); if(p){ p.number = inp.value.trim()===''?'':Number(inp.value); save(); render(); }
    }));
    el.querySelectorAll('[data-remove-player]').forEach(b=>b.addEventListener('click',()=>{
      const p=player(b.dataset.removePlayer); if(!p) return;
      const back=()=>{ sheet='players'; sheetData={}; renderSheet(); };
      askConfirm(`${p.name} verwijderen?`, 'De speler verdwijnt uit de spelerslijst en van het veld.', 'Verwijder', ()=>{ removePlayer(p.id); render(); back(); }, true);
    }));
  }
  el.querySelectorAll('[data-confirm],[data-confirm-more]').forEach(b=>b.addEventListener('click',()=>{
    const more = b.hasAttribute('data-confirm-more');
    confirmSheet(more);
  }));
}

function confirmSheet(more){
  if(sheet==='confirm'){
    const cb=confirmCb; confirmCb=null; sheet=null; sheetData={};
    if(cb) cb(); else render();
    return;
  }
  if(sheet==='goalUs'){
    S.score.us++;
    const og = sheetData.scorer==='og';
    addEvent('goal', { scorer: og?null:sheetData.scorer, assist: og?null:(sheetData.assist||null), ownGoal: og, score:{...S.score} }, sheetData.at);
    toast(scoreStr());
  } else if(sheet==='goalThem'){
    S.score.them++;
    addEvent('goalThem', { ownGoal: sheetData.ownGoal||null, score:{...S.score} }, sheetData.at);
    toast(scoreStr());
  } else if(sheet==='sub'){
    const {out, in:pin}=sheetData;
    const pos = sheetData.pos!==undefined ? sheetData.pos : (S.positions[out]||null);
    S.onField = S.onField.map(x=>x===out?pin:x);
    delete S.positions[out];
    if(pos) S.positions[pin]=pos; else delete S.positions[pin];
    addEvent('sub', { out, in:pin, pos }, sheetData.at);
    toast(`${shortName(pin)} erin, ${shortName(out)} eruit`);
    if(more){ save(); sheetData={ at: sheetData.at }; render(); return; }
  } else if(sheet==='positions'){
    const next = sheetData.pos||{};
    const changes=[];
    S.onField.forEach(id=>{ const a=S.positions[id]||null, b=next[id]||null; if(a!==b) changes.push({id,pos:b}); });
    if(!changes.length){ closeSheet(); return; }
    S.onField.forEach(id=>{ if(next[id]) S.positions[id]=next[id]; else delete S.positions[id]; });
    addEvent('positions', { changes }, sheetData.at);
    toast('Posities aangepast');
  } else if(sheet==='note'){
    const text=(sheetData.text||'').trim(); if(!text){ return; }
    addEvent('note', { text }, sheetData.at);
    toast('Genoteerd');
  }
  save(); sheet=null; sheetData={}; render();
}

/* ---------- Visibility: resync clock after background ---------- */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible'){ lastTick = lastTick || Date.now(); render(); }
  else { if(S.periodStatus==='running') creditMinutes(); save(); }
});
window.addEventListener('pagehide', ()=>{ if(S.periodStatus==='running') creditMinutes(); save(); });

/* ---------- Boot ---------- */
if(S.periodStatus==='running'){ lastTick=Date.now(); ensureTick(); }
render();
})();
</script>
</body>
</html>
